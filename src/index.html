<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nehang Shah, Senior Full-Stack Engineer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/fira-code-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e7ecef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <!-- Apply the saved theme before first paint so the page doesn't flash. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
      document.documentElement.classList.add('js');
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
