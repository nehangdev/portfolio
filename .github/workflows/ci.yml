name: CI

# Every push to main and every pull request runs the full quality bar:
# formatting, build, unit tests, end-to-end + accessibility + visual tests,
# Lighthouse (median of 3; accessibility, best practices and SEO >= 95, performance
# reported as a warning), the JavaScript budget, and links.
# Deployment is separate: Vercel builds and deploys every push to main itself.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, test and measure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (formatting)
        run: npm run format:check

      - name: Install Chromium for Playwright and Lighthouse
        run: npx playwright install --with-deps chromium

      # Builds, runs unit and e2e tests (including axe and visual comparisons),
      # runs Lighthouse, writes the build report, rebuilds with it, and enforces the gates.
      - name: Build, test, Lighthouse and budgets
        run: npm run report

      - name: Check links
        run: npm run links

      - name: Summary
        if: always()
        run: |
          if [ -f src/content/build-report.ts ]; then
            {
              echo '### Build report'
              echo '```ts'
              cat src/content/build-report.ts
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: reports/lighthouse
          if-no-files-found: ignore

      - name: Upload test failures (screenshots, diffs, traces)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore
